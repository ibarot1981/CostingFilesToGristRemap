      mode: blank
      fields:
        - rate
        - cut_piece_cost
        - transport_rate
        - unloading_rate
        - fabrication_rate
        - amount
    grist:
      enabled: true
      table_id: ProductPartMSList
      key_fields:
        - material_to_cut
        - dimension_to_cut_mm
        - qty
        - optional_item_group_1
      allow_blank_key_fields:
        - optional_item_group_1
      compare_fields: []
      report_fields:
        - product_part_name
        - optional_item_group_1
        - cr_log
        - remarks
        - cr_log
      excluded_record_values:
        Part_Status:
          - Delete
      material_field: material_to_cut
      comparable_material_field: ODSComparableMaterial
      tally_field: TallyWithODS
      ods_to_grist_fields:
        material_to_cut: MaterialToCut
        dimension_to_cut_mm: Length_mm
        qty: QtyNos
        product_part_name: ProductPartName_ProductPartName
        optional_item_group_1: OptionGroup1_TEMP
