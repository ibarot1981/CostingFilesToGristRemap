        - material_to_cut
      qty_fields:
        - qty
      inactive_flag_fields:
        - in_use
      inactive_values:
        - "no"
        - "n"
        - "false"
        - "0"
        - "inactive"
        - "not in use"
        - "unused"
        - "delete"
